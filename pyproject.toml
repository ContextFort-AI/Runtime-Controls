[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-runtime-monitor"
version = "0.2.0"
description = "Security monitoring and audit logging for Claude Code with embedded LLM judge"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Security Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
judge = ["llama-cpp-python>=0.2.0"]
all = ["llama-cpp-python>=0.2.0"]

[project.scripts]
claude-monitor = "claude_monitor.cli:main"
claude-judge = "claude_monitor.judge:main"

[tool.setuptools.packages.find]
where = ["."]
